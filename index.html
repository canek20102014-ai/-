<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт закрыт</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    .box {
      max-width: 600px;
      padding: 40px 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #555;
    }

    .timer {
      margin-top: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🔒 Сайт официально закрыт</h1>

    <p>
      Данный сайт больше не работает и официально закрыт.
    </p>

    <p>
      Спасибо всем, кто пользовался сайтом!
    </p>

    <div class="timer">
      Переадресация через <span id="count">5</span> секунд...
    </div>
  </div>

  <script>
    let seconds = 5;
    const count = document.getElementById("count");

    const timer = setInterval(() => {
      seconds--;
      count.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace("https://www.google.com/");
      }
    }, 1000);
  </script>

</body>
</html>
